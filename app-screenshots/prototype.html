<title>تطبيق أمان وكهرباء</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Alexandria:wght@500;600;700;800&display=swap">
<style>
/* Layout: a real-feeling phone (status bar, scroll view, bottom nav, sheets) beside a short control panel; full-bleed on phones */
:root{
  --page:#dfe5ec; --surface:#f6f8fb; --card:#ffffff; --card-2:#eef2f7; --line:#dbe2ea;
  --fg:#101b27; --muted:#5d6d7e; --faint:#8e9cab;
  --ink:#0c2440; --ink-2:#163a63; --on-ink:#ffffff;
  --amber:#ffb020; --on-amber:#231700;
  --ok:#14915a; --ok-bg:#dff5ea; --warn:#b26a00; --warn-bg:#fff1d6; --bad:#c8352b; --bad-bg:#fde5e3;
  --wa:#1fae58;
  --c-elec:#b06d00; --c-elec-bg:#fff2d4;
  --c-cam:#1857b8; --c-cam-bg:#e2edff;
  --c-alarm:#c13a2e; --c-alarm-bg:#ffe5e1;
  --c-sound:#6b3fc4; --c-sound-bg:#efe6ff;
  --shadow:0 1px 2px rgba(12,36,64,.06),0 8px 24px -12px rgba(12,36,64,.18);
  --f-display:"Alexandria","Almarai",system-ui,sans-serif;
  --f-body:"Almarai",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#070c12; --surface:#0d151e; --card:#15202b; --card-2:#1c2936; --line:#26364a;
  --fg:#e9f0f7; --muted:#9aabbd; --faint:#6f8296;
  --ink:#11335a; --ink-2:#1d4a7e; --on-ink:#ffffff; --amber:#ffbb3a; --on-amber:#231700;
  --ok:#3ccf86; --ok-bg:#12352a; --warn:#ffc256; --warn-bg:#3a2b10; --bad:#ff7a6e; --bad-bg:#3d1b19; --wa:#2bc466;
  --c-elec:#ffc456; --c-elec-bg:#33270f; --c-cam:#7fb0ff; --c-cam-bg:#14284a;
  --c-alarm:#ff8a7c; --c-alarm-bg:#3b1a17; --c-sound:#bb9bff; --c-sound-bg:#291d47;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#070c12; --surface:#0d151e; --card:#15202b; --card-2:#1c2936; --line:#26364a;
  --fg:#e9f0f7; --muted:#9aabbd; --faint:#6f8296;
  --ink:#11335a; --ink-2:#1d4a7e; --on-ink:#ffffff; --amber:#ffbb3a; --on-amber:#231700;
  --ok:#3ccf86; --ok-bg:#12352a; --warn:#ffc256; --warn-bg:#3a2b10; --bad:#ff7a6e; --bad-bg:#3d1b19; --wa:#2bc466;
  --c-elec:#ffc456; --c-elec-bg:#33270f; --c-cam:#7fb0ff; --c-cam-bg:#14284a;
  --c-alarm:#ff8a7c; --c-alarm-bg:#3b1a17; --c-sound:#bb9bff; --c-sound-bg:#291d47;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--page);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- stage ---------- */
.stage{display:flex;gap:40px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.side{width:300px;display:flex;flex-direction:column;gap:16px;padding-top:40px}
.side h1{font-size:26px;line-height:1.3}
.side p{color:var(--muted)}
.switch{display:flex;flex-direction:column;gap:8px}
.switch button{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:start}
.switch button[aria-pressed="true"]{border-color:var(--ink-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink-2) 25%,transparent)}
.switch b{display:block;font-size:14.5px}
.switch small{color:var(--muted)}
.switch .dot{width:36px;height:36px;border-radius:10px;background:var(--card-2);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.reset{font-size:13px;color:var(--muted);text-decoration:underline;align-self:flex-start}
.legal{font-size:12px;color:var(--faint)}

.device{width:390px;max-width:100%;height:812px;max-height:calc(100vh - 48px);min-height:640px;background:var(--surface);border-radius:46px;
  border:10px solid #0b0f14;box-shadow:0 40px 80px -30px rgba(5,15,30,.55);position:relative;overflow:hidden;display:flex;flex-direction:column}
.sbar{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600;direction:ltr;position:relative;z-index:5}
.sbar .notch{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:110px;height:28px;border-radius:20px;background:#0b0f14}
.sbar.dark{background:var(--ink);color:var(--on-ink)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
@media (max-width:520px){
  body{padding:0}
  .stage{gap:0}
  .side{width:100%;padding:14px max(16px,env(safe-area-inset-left,0px)) 10px;gap:10px}
  .side h1,.side>p,.legal{display:none}
  .switch{flex-direction:row}.switch button{flex:1;padding:10px}.switch small{display:none}.switch .dot{display:none}
  .device{width:100%;border:0;border-radius:0;height:calc(100vh - 70px);max-height:none;box-shadow:none}
  .sbar{display:none}
}

/* ---------- shared bits ---------- */
.pad{padding:0 18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 18px;margin-top:22px;margin-bottom:10px}
.sec-h h3{font-size:16.5px}
.sec-h button{font-size:13px;color:var(--c-cam);font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:15px 18px;font-weight:700;font-size:15.5px;background:var(--amber);color:var(--on-amber);width:100%;transition:transform .12s,opacity .2s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.ink{background:var(--ink);color:var(--on-ink)}
.btn.soft{background:var(--card-2);color:var(--fg)}
.btn.wa{background:var(--wa);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:12px}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none;position:relative}
.badge{position:absolute;top:-5px;left:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.input{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;transition:border-color .15s}
.input:focus{outline:none;border-color:var(--ink-2)}
textarea.input{min-height:92px;resize:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:0 18px;margin:0 -18px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;font-weight:600;font-size:14px;white-space:nowrap;transition:all .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.seg{display:flex;background:var(--card-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:600;color:var(--muted);transition:all .2s}
.seg button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.enter{animation:enter .28s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateX(-14px)}}
.enter.back{animation-name:enterb}
@keyframes enterb{from{opacity:0;transform:translateX(14px)}}

/* ---------- top bars ---------- */
.topbar{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 18px;display:flex;align-items:center;gap:12px}
.topbar h2{font-size:18px;flex:1}

/* ---------- onboarding ---------- */
.ob{min-height:100%;display:flex;flex-direction:column;background:var(--ink);color:var(--on-ink)}
.ob-hero{padding:26px 24px 30px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.ob-hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.ob-hero>*{position:relative}
.mark{width:54px;height:54px;border-radius:16px;background:var(--amber);color:var(--on-amber);display:grid;place-items:center}
.ob-hero h1{font-size:27px;line-height:1.3}
.ob-hero p{opacity:.78}
.ob-tags{display:flex;gap:6px;flex-wrap:wrap}
.ob-tags span{font-size:12.5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.ob-card{flex:1;background:var(--surface);color:var(--fg);border-radius:28px 28px 0 0;padding:22px 20px 24px;display:flex;flex-direction:column;gap:18px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.steps i.on{background:var(--amber)}
.ob-card h2{font-size:21px}
.big-input{font-size:20px;padding:16px;border-radius:16px;text-align:start}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.area{padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:start;font-weight:600;display:flex;align-items:center;gap:8px;transition:all .15s}
.area[aria-pressed="true"]{border-color:var(--ink-2);background:color-mix(in srgb,var(--ink-2) 10%,var(--card))}
.area svg{color:var(--faint)}
.area[aria-pressed="true"] svg{color:var(--ink-2)}
.hint{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}

/* ---------- home ---------- */
.hello{background:var(--ink);color:var(--on-ink);padding:6px 18px 66px;border-radius:0 0 30px 30px;display:flex;flex-direction:column;gap:14px}
.hello .iconbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14);color:var(--on-ink)}
.hello .badge{border-color:var(--ink)}
.loc{display:flex;align-items:center;gap:6px;font-size:13px;opacity:.85}
.hello h1{font-size:22px}
.search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:0 14px}
.search input{flex:1;background:none;border:0;padding:13px 0;color:var(--on-ink);outline:none;min-width:0}
.search input::placeholder{color:rgba(255,255,255,.6)}
.offers-wrap{margin-top:-50px}
.offers{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 18px;scrollbar-width:none;scroll-behavior:smooth}
.offers::-webkit-scrollbar{display:none}
.offer{flex:0 0 86%;scroll-snap-align:center;border-radius:22px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;text-align:start;min-height:168px;box-shadow:var(--shadow)}
.offer .art{position:absolute;left:-6px;bottom:-8px;width:120px;height:120px;opacity:.95;color:rgba(255,255,255,.9)}
.offer .tag{align-self:flex-start;background:var(--amber);color:var(--on-amber);border-radius:8px;padding:2px 10px;font-size:12px;font-weight:700}
.offer b{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.3;max-width:70%}
.offer .d{font-size:13px;opacity:.85;max-width:68%}
.offer .p{display:flex;align-items:baseline;gap:8px;margin-top:auto}
.offer .p strong{font-size:22px;font-family:var(--f-display)}
.offer .p s{opacity:.6;font-size:14px}
.cd{display:inline-flex;gap:4px;font-size:12px;direction:ltr;align-self:flex-start;background:rgba(0,0,0,.25);padding:3px 8px;border-radius:8px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:all .3s}
.dots i.on{width:18px;background:var(--ink-2)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.cat{border-radius:22px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:6px;min-height:138px;position:relative;overflow:hidden;transition:transform .15s}
.cat:active{transform:scale(.97)}
.cat .ci{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--card);margin-bottom:auto}
.cat b{font-family:var(--f-display);font-size:16.5px}
.cat span{font-size:12px;opacity:.8}
.cat[data-c="elec"]{background:var(--c-elec-bg);color:var(--c-elec)}
.cat[data-c="cam"]{background:var(--c-cam-bg);color:var(--c-cam)}
.cat[data-c="alarm"]{background:var(--c-alarm-bg);color:var(--c-alarm)}
.cat[data-c="sound"]{background:var(--c-sound-bg);color:var(--c-sound)}
.cat b,.cat span{color:var(--fg)}
.builder-cta{margin:0 18px;border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--ink),var(--ink-2));color:var(--on-ink);text-align:start;width:calc(100% - 36px)}
.builder-cta .ci{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.builder-cta b{font-family:var(--f-display);font-size:16px;display:block}
.builder-cta span{font-size:12.5px;opacity:.8}
.sos{margin:12px 18px 0;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--bad-bg);color:var(--bad);text-align:start;width:calc(100% - 36px);font-weight:600}
.sos .pulse{width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 var(--bad);animation:pulse 1.6s infinite;flex:none}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sos small{display:block;color:var(--muted);font-weight:400}
.mini-order{margin:0 18px;padding:14px;display:flex;gap:12px;align-items:center;text-align:start;width:calc(100% - 36px)}

/* ---------- products ---------- */
.cat-head{padding:4px 18px 16px;display:flex;flex-direction:column;gap:14px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.prod{padding:10px;display:flex;flex-direction:column;gap:8px;position:relative}
.prod .img{aspect-ratio:1/1;max-width:100%;border-radius:14px;display:grid;place-items:center;background:var(--card-2);color:var(--ink-2)}
.prod .img svg{width:62%;height:62%}
.prod .brand{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.prod b{font-size:14px;line-height:1.35;min-height:2.7em}
.prod .foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.prod .price{font-family:var(--f-display);font-weight:700;font-size:16px}
.add{width:36px;height:36px;border-radius:12px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:20px;font-weight:600}
.stepper{display:flex;align-items:center;background:var(--ink);color:var(--on-ink);border-radius:12px;height:36px}
.stepper button{width:32px;height:36px;font-size:18px;font-weight:700;color:inherit}
.stepper span{min-width:18px;text-align:center;font-weight:700;font-size:14px}
.ribbon{position:absolute;top:16px;right:16px;background:var(--amber);color:var(--on-amber);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}

.cartbar{position:sticky;bottom:12px;margin:16px 14px 0;z-index:6;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--on-ink);border-radius:20px;padding:10px 10px 10px 16px;box-shadow:0 14px 30px -10px rgba(5,20,40,.55);animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.cartbar .count{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:700}
.cartbar .count.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.2)}}
.cartbar .t{flex:1;line-height:1.3}
.cartbar .t small{opacity:.7;font-size:12px;display:block}
.cartbar .btn{width:auto;padding:11px 16px;border-radius:14px}

/* ---------- repair ---------- */
.issues{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}
.issue{padding:14px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);text-align:start;display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:14px;transition:all .15s}
.issue .ii{width:36px;height:36px;border-radius:11px;background:var(--card-2);display:grid;place-items:center;color:var(--ink-2)}
.issue[aria-pressed="true"]{border-color:var(--ink-2);background:color-mix(in srgb,var(--ink-2) 9%,var(--card))}
.issue[aria-pressed="true"] .ii{background:var(--ink);color:var(--on-ink)}
.urg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.urg button{padding:12px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);text-align:start}
.urg button b{display:block;font-size:14.5px}
.urg button small{color:var(--muted)}
.urg button[aria-pressed="true"]{border-color:var(--ink-2);background:color-mix(in srgb,var(--ink-2) 9%,var(--card))}
.urg button.red[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-bg)}
.upload{border:1.5px dashed var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;background:var(--card)}
.upload input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:58px;height:58px;object-fit:cover;border-radius:10px}

/* ---------- builder ---------- */
.bstep{padding:16px;display:flex;flex-direction:column;gap:12px}
.bstep h4{font-size:15px;display:flex;align-items:center;gap:8px}
.bstep h4 i{font-style:normal;width:24px;height:24px;border-radius:8px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:12.5px}
.counter{display:flex;align-items:center;justify-content:space-between;background:var(--card-2);border-radius:16px;padding:8px}
.counter button{width:46px;height:46px;border-radius:13px;background:var(--card);font-size:22px;font-weight:700;box-shadow:var(--shadow)}
.counter .v{text-align:center}
.counter .v strong{font-family:var(--f-display);font-size:30px;display:block;line-height:1}
.camdots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.camdots i{width:14px;height:14px;border-radius:4px;background:var(--c-cam);opacity:.9;animation:pop .2s}
@keyframes pop{from{transform:scale(0)}}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{padding:12px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:13.5px;text-align:center}
.opt small{font-weight:400;color:var(--muted);font-size:11.5px}
.opt[aria-pressed="true"]{border-color:var(--ink-2);background:color-mix(in srgb,var(--ink-2) 10%,var(--card))}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(-20px)}
.bom{padding:16px;display:flex;flex-direction:column;gap:10px}
.bom-line{display:flex;align-items:center;gap:10px;font-size:14px}
.bom-line .q{width:30px;height:26px;border-radius:8px;background:var(--card-2);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.bom-line .n{flex:1;min-width:0}
.bom-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.bom-total strong{font-family:var(--f-display);font-size:24px}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;background:rgba(5,12,22,.5);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:28px 28px 0 0;max-height:92%;overflow-y:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:10px 18px 22px}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sum-line{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0}
.sum-line+.sum-line{border-top:1px solid var(--line)}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px}
.sum-total strong{font-family:var(--f-display);font-size:22px}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- success ---------- */
.success{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px 24px;position:relative;overflow:hidden}
.success canvas{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.check{width:96px;height:96px;border-radius:50%;background:var(--ok);display:grid;place-items:center;animation:scaleIn .5s cubic-bezier(.2,1.4,.4,1)}
.check svg path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .25s forwards}
@keyframes scaleIn{from{transform:scale(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
.success h1{font-size:24px}
.ticket{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:600}
.success .btns{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:8px}

/* ---------- orders / tracking ---------- */
.order{padding:16px;margin:0 18px 12px;display:flex;flex-direction:column;gap:12px}
.status{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.s0{background:var(--warn-bg);color:var(--warn)}
.s1{background:var(--c-cam-bg);color:var(--c-cam)}
.s2{background:var(--c-sound-bg);color:var(--c-sound)}
.s3{background:var(--ok-bg);color:var(--ok)}
.track{display:flex;gap:0;position:relative}
.track div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;text-align:center;color:var(--muted);position:relative}
.track div::before{content:"";position:absolute;top:9px;left:50%;width:100%;height:3px;background:var(--line);z-index:0}
.track div:first-child::before{display:none}
.track div.on::before{background:var(--ok)}
.track i{width:20px;height:20px;border-radius:50%;background:var(--card-2);border:3px solid var(--line);z-index:1;display:grid;place-items:center}
.track div.on i{background:var(--ok);border-color:var(--ok)}
.track div.cur i{box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 25%,transparent)}
.track div.on{color:var(--fg);font-weight:600}
.empty{padding:50px 30px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty .ei{width:80px;height:80px;border-radius:24px;background:var(--card-2);display:grid;place-items:center;color:var(--faint)}

/* ---------- chat ---------- */
.chatwrap{display:flex;flex-direction:column;min-height:100%}
.chat-head{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.avatar{width:42px;height:42px;border-radius:14px;background:var(--amber);color:var(--on-amber);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);flex:none;position:relative}
.avatar.on::after{content:"";position:absolute;bottom:-2px;left:-2px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.msgs{flex:1;padding:16px 14px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:9px 13px;border-radius:18px;font-size:14.5px;animation:pop2 .2s;position:relative}
@keyframes pop2{from{opacity:0;transform:translateY(6px)}}
.msg.me{align-self:flex-start;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:6px}
.msg.them{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg time{display:block;font-size:10.5px;opacity:.6;margin-top:2px}
.msg.sys{align-self:center;background:var(--card-2);color:var(--muted);font-size:12.5px;border-radius:10px;max-width:90%;text-align:center}
.typing{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25;transform:translateY(-3px)}}
.quick{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}
.quick button{white-space:nowrap;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.composer{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 14px;background:var(--surface);border-top:1px solid var(--line)}
.composer input{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:11px 16px;outline:none;min-width:0}
.composer button{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}

/* ---------- nav ---------- */
.nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--faint);position:relative;padding:4px 0}
.nav button[aria-current="page"]{color:var(--ink-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav button[aria-current="page"]{color:var(--amber)}}
:root[data-theme="dark"] .nav button[aria-current="page"]{color:var(--amber)}
.nav .badge{top:-2px;left:calc(50% - 22px)}

/* ---------- admin ---------- */
.adm-head{background:var(--ink);color:var(--on-ink);padding:8px 18px 20px;display:flex;flex-direction:column;gap:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px}
.stat strong{font-family:var(--f-display);font-size:24px;display:block;line-height:1.1}
.stat span{font-size:11.5px;opacity:.75}
.spark{height:40px;width:100%}
.req{padding:14px;margin:0 18px 12px;display:flex;flex-direction:column;gap:10px;border-inline-start:4px solid transparent}
.req.new{border-inline-start-color:var(--amber)}
.req ul{margin:0;padding-inline-start:18px;font-size:13.5px;color:var(--muted)}
.req .acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.req .acts .btn{padding:10px 6px;font-size:13.5px;border-radius:12px}
.statusbar{display:flex;gap:6px;flex-wrap:wrap}
.statusbar button{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;background:var(--card)}
.statusbar button[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.offer-row{padding:12px;margin:0 18px 10px;display:flex;gap:12px;align-items:center}
.offer-row .sw-mini{width:52px;height:52px;border-radius:14px;flex:none}

/* ---------- toast ---------- */
.toast{position:absolute;top:52px;left:12px;right:12px;z-index:30;background:var(--card);border:1px solid var(--line);box-shadow:0 16px 40px -12px rgba(5,15,30,.45);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;transform:translateY(-140%);transition:transform .4s cubic-bezier(.2,1.2,.4,1)}
.toast:not(.on){pointer-events:none;visibility:hidden;transition:transform .4s,visibility 0s .4s}
.toast.on{transform:none}
.toast .ti{width:38px;height:38px;border-radius:12px;background:var(--amber);color:var(--on-amber);display:grid;place-items:center;flex:none}
.toast b{display:block;font-size:14px}
.toast span{font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.toast{top:10px}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ================= camera package builder ================= */
function buildPackage(){
 const b=st.b,n=b.count,out=[],add=(n2,q,p)=>out.push({n:n2,q,p});
 const hik=b.brand==="Hikvision",hi=b.res==="4MP";
 const indoor=b.place==="in"?n:b.place==="out"?0:Math.floor(n/2),outdoor=n-indoor;
 if(b.tech==="wifi"){
   if(outdoor)add(`كاميرا واي فاي خارجية ${b.res}`,outdoor,hi?48:42);
   if(indoor)add(`كاميرا واي فاي داخلية متحركة ${b.res}`,indoor,hi?38:34);
   add("ذاكرة MicroSD 128GB",n,9);
 }else{
   const ip=b.tech==="ip",base=ip?(hi?48:40):(hi?29:(hik?22:19));
   if(outdoor)add(`كاميرا ${ip?"IP ":""}خارجية ${b.res} · ${b.brand}`,outdoor,base);
   if(indoor)add(`كاميرا ${ip?"IP ":""}قبة داخلية ${b.res} · ${b.brand}`,indoor,base-2);
   const ch=n<=4?4:n<=8?8:16;
   add(`جهاز ${ip?"NVR":"DVR"} ${ch} قنوات · ${b.brand}`,1,ip?{4:62,8:78,16:140}[ch]:{4:45,8:68,16:120}[ch]);
   const tb=n*(hi?2:1)<=4?1:n*(hi?2:1)<=8?2:4;
   add(`هارد مراقبة ${tb}TB`,1,{1:42,2:62,4:105}[tb]);
   const rolls=Math.ceil(n*25/100);
   if(ip){add("سويتش PoE "+(n<=4?4:n<=8?8:16)+" مخرج",1,n<=4?35:n<=8?55:95);add("كبل شبكة Cat6 · 100م",rolls,32);add("رؤوس RJ45 · 20 قطعة",1,4)}
   else{add("كبل كاميرات · 100م",rolls,18);add(`باور سبلاي ${n<=4?4:n<=8?8:16} مخارج`,1,n<=4?9:n<=8?15:26);add("رؤوس BNC · 10 قطع",Math.ceil(n*2/10),3)}
 }
 if(b.install)add("أجور التركيب والبرمجة (لكل كاميرا)",n,b.tech==="wifi"?5:8);
 return{lines:out,total:out.reduce((s,x)=>s+x.q*x.p,0)};
}

/* countdown + carousel */
function tick(){document.querySelectorAll("[data-ends]").forEach(el=>{let s=Math.max(0,Math.floor((+el.dataset.ends-Date.now())/1000));const d=Math.floor(s/86400);s%=86400;const h=String(Math.floor(s/3600)).padStart(2,"0"),m=String(Math.floor(s%3600/60)).padStart(2,"0"),x=String(s%60).padStart(2,"0");el.textContent=(d?d+"d ":"")+`${h}:${m}:${x}`+(el.closest(".offer")?" ⏱":"")});
 const c=new Date();$("#clock").textContent=c.getHours()+":"+String(c.getMinutes()).padStart(2,"0")}
setInterval(tick,1000);
let carouselPause=0;
setInterval(()=>{const off=$("#offers");if(!off||Date.now()<carouselPause||matchMedia("(prefers-reduced-motion:reduce)").matches)return;const w=off.firstElementChild.offsetWidth+12,i=Math.round(Math.abs(off.scrollLeft)/w),n=off.children.length;off.scrollTo({left:-(((i+1)%n)*w)})},4200);
document.addEventListener("pointerdown",e=>{if(e.target.closest("#offers"))carouselPause=Date.now()+8000});

/* decorative canvases */
function drawGrid(cv){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;const x=cv.getContext("2d");x.scale(d,d);x.strokeStyle="rgba(255,255,255,.09)";
 for(let i=0;i<r.width;i+=22){x.beginPath();x.moveTo(i,0);x.lineTo(i,r.height);x.stroke()}for(let j=0;j<r.height;j+=22){x.beginPath();x.moveTo(0,j);x.lineTo(r.width,j);x.stroke()}
 x.strokeStyle="rgba(255,176,32,.55)";x.lineWidth=2;x.beginPath();x.moveTo(r.width,44);x.lineTo(r.width-88,44);x.lineTo(r.width-88,110);x.lineTo(r.width-176,110);x.stroke();x.fillStyle="#ffb020";[[r.width-88,44],[r.width-176,110]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,3.5,0,7);x.fill()})}
function confetti(cv){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const r=cv.getBoundingClientRect(),x=cv.getContext("2d");cv.width=r.width;cv.height=r.height;const cols=["#ffb020","#1857b8","#14915a","#c13a2e","#6b3fc4"];
 const ps=Array.from({length:90},()=>({x:r.width/2,y:r.height*.32,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:Math.random()*6+4,c:cols[Math.random()*5|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));let f=0;
 (function loop(){x.clearRect(0,0,r.width,r.height);ps.forEach(p=>{p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<130&&cv.isConnected)requestAnimationFrame(loop);else x.clearRect(0,0,r.width,r.height)})()}

/* toast */
let toastT;
function toast(title,sub,icon=IC.bell){const t=$("#toast");t.innerHTML=`<span class="ti">${icon}</span><span style="flex:1"><b>${title}</b><span>${sub}</span></span>`;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),3200)}

/* ================= events ================= */
$("#m-app").onclick=()=>{if(st.mode==="app")return;closeSheet();st.mode="app";st.stack=[];st.route=user?{s:"home"}:{s:"ob",step:0};render(true);
 const changed=myOrders().filter(o=>(seen.user[o.id]??0)!==o.status);if(changed.length){const o=changed[0];toast(`تحديث على طلب #${o.id}`,STATUSES[o.status],IC.orders);changed.forEach(o=>seen.user[o.id]=o.status);save()}
 else if(unreadUser())toast("رسالة جديدة من المحل","افتح المحادثة لتشوفها",IC.chat)};
$("#m-admin").onclick=()=>{if(st.mode==="admin")return;closeSheet();st.mode="admin";st.stack=[];st.route={s:"inbox"};render(true);
 const fresh=orders.filter(o=>o.id>seen.admin);if(fresh.length){toast(`وصلك طلب جديد #${fresh[0].id}`,`${fresh[0].name} · ${cat(fresh[0].cat).name} · ${fresh[0].area}`,IC.bag);seen.admin=Math.max(...orders.map(o=>o.id));save()}
 else if(unreadAdmin())toast("رسالة جديدة من زبون","افتح المحادثات",IC.chat)};
$("#reset").onclick=()=>{try{Object.keys(localStorage).filter(k=>k.startsWith("sec_")).forEach(k=>localStorage.removeItem(k))}catch(e){}
 user=null;orders=seedOrders();offers=DEFAULT_OFFERS.map(o=>({...o,ends:Date.now()+o.hrs*3600e3}));cart={};pkgs={};seen={admin:1042,user:{}};
 st.mode="app";st.stack=[];st.route={s:"ob",step:0};st.ob={name:"",phone:"",area:""};st.q="";closeSheet();render(true)};
$("#scrim").onclick=closeSheet;

function setQty(key,d){cart[key]=Math.max(0,(cart[key]||0)+d);if(!cart[key])delete cart[key];save();tap()}

document.addEventListener("click",e=>{
 const t=e.target.closest("button,a");if(!t||!t.closest("#device"))return;const d=t.dataset;
 if(d.tabnav){closeSheet();st.stack=[];if(d.tabnav==="chat"&&st.mode==="admin"&&!st.chatId)st.chatId=orders[0]?.id;st.route={s:d.tabnav};dir="";render(true);return}
 if(d.area){st.ob.area=d.area;render();return}
 if(d.cat){st.filter="الكل";st.tab="parts";nav({s:"cat",cat:d.cat});return}
 if(d.offer){const o=offers.find(x=>x.id===+d.offer);if(o.cat==="cam"&&o.art==="bullet"){Object.assign(st.b,{count:4,place:"out",tech:"analog",brand:"Hikvision",res:"2MP",install:true});nav({s:"builder"})}else{st.filter="الكل";st.tab="parts";nav({s:"cat",cat:o.cat})}return}
 if(d.goprod){const p=ALLP.find(x=>x.key===d.goprod);st.q="";st.filter=p.g;st.tab="parts";nav({s:"cat",cat:p.cat});return}
 if(d.q){setQty(d.q,+d.d);if(d.insheet){cartCount()?checkoutSheet("parts"):closeSheet()}render();const cc=$("#cc");if(cc&&+d.d>0)cc.classList.add("bump");return}
 if(d.filter){st.filter=d.filter;render();return}
 if(d.tab){st.tab=d.tab;render();return}
 if(d.issue){st.fix.note=$("#fix-note")?.value??st.fix.note;st.fix.issue=d.issue;tap();render();return}
 if(d.urg){st.fix.note=$("#fix-note")?.value??st.fix.note;st.fix.urgent=d.urg==="1";render();return}
 if(d.when){st.fix.note=$("#fix-note")?.value??st.fix.note;st.fix.when=d.when;render();return}
 if(d.b){st.b[d.b]=d.v;tap();render();return}
 if(d.cnt){st.b.count=Math.min(16,Math.max(1,st.b.count+ +d.cnt));tap();render();return}
 if(d.via){document.querySelectorAll("#c-via .chip").forEach(c=>c.setAttribute("aria-pressed",c===t));return}
 if(d.af){st.adminFilter=d.af;render();return}
 if(d.setst){const o=orders.find(x=>x.id===+d.setst);o.status=+d.v;save();render();toast(`طلب #${o.id}`,"صار: "+STATUSES[o.status],IC.check.replace('stroke="#fff"','stroke="currentColor"'));return}
 if(d.contact){const o=orders.find(x=>x.id===+d.contact);if(o.status===0){o.status=1;save();setTimeout(render,50)}return}
 if(d.delof){offers=offers.filter(o=>o.id!==+d.delof);save();render();return}
 if(d.quick){$("#msg").value=d.quick;$("#f-chat").requestSubmit();return}
 const a=d.act;if(!a)return;
 if(a==="back")back();
 else if(a==="ob-back"){st.route={s:"ob",step:st.route.step-1};dir="back";render(true)}
 else if(a==="area"){openSheet(`<h2 style="font-size:20px;margin-bottom:14px">غيّر منطقتك</h2><div class="areas">${AREAS.map(x=>`<button class="area" data-setarea="${x}" aria-pressed="${user.area===x}">${IC.pin}${x}</button>`).join("")}</div>`)}
 else if(a==="cart")checkoutSheet("parts");
 else if(a==="builder")nav({s:"builder"});
 else if(a==="install"){st.b.install=!st.b.install;render()}
 else if(a==="pkg-add"){const pk=buildPackage(),b=st.b,key="pkg:"+[b.count,b.place,b.tech,b.brand,b.res,b.install].join("-");
   pkgs[key]=({n:`منظومة ${b.count} كاميرات ${b.tech==="wifi"?"واي فاي":b.tech==="ip"?"IP":"سلكية"} ${b.tech!=="wifi"?b.brand:""} ${b.res}${b.install?" مع التركيب":""}`.replace(/\s+/g," "),p:pk.total,cat:"cam",a:"dvr",lines:pk.lines});
   cart[key]=1;save();tap();toast("انضافت المنظومة للسلة",`${money(pk.total)} · ${pk.lines.length} بنود`,IC.bag);setTimeout(()=>checkoutSheet("parts"),350)}
 else if(a==="sos"){st.tab="fix";st.fix={issue:null,urgent:true,when:"أقرب وقت",note:"",photos:[]};openSheet(`<h2 style="font-size:20px;margin-bottom:6px">شو نوع العطل؟</h2><p class="small muted" style="margin-bottom:14px">بنعطي الأعطال الطارئة أولوية.</p><div class="issues" style="padding:0">${CATS.map(c=>`<button class="issue" data-sos="${c.id}"><span class="ii" style="color:var(--c-${c.id})">${IC[c.id]}</span>${c.name}</button>`).join("")}</div>`)}
 else if(a==="fix-go"){st.fix.note=$("#fix-note")?.value||"";checkoutSheet("fix")}
 else if(a==="track"){st.stack=[];st.route={s:"orders"};render(true)}
 else if(a==="chat"){st.chatId=+d.id;closeSheet();nav({s:"chat"})}
 else if(a==="new-offer")offerSheet();
});
document.addEventListener("click",e=>{const t=e.target.closest("[data-setarea],[data-sos]");if(!t)return;
 if(t.dataset.setarea){user.area=t.dataset.setarea;save();closeSheet();render()}
 if(t.dataset.sos){closeSheet();st.filter="الكل";nav({s:"cat",cat:t.dataset.sos})}});

document.addEventListener("input",e=>{
 const id=e.target.id;
 if(id==="ob-name"||id==="ob-phone"){st.ob[id==="ob-name"?"name":"phone"]=e.target.value;const s=st.route.step,o=st.ob;$("#ob-next").disabled=!(s===0?o.name.trim().length>1:o.phone.replace(/\D/g,"").length>=9)}
 if(id==="q"){st.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}
 if(id==="fix-note")st.fix.note=e.target.value;
});
document.addEventListener("change",e=>{if(e.target.id!=="photos")return;const files=[...e.target.files].slice(0,4);let left=files.length;
 files.forEach(f=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),k=160/Math.max(img.width,img.height);c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);st.fix.photos.push(c.toDataURL("image/jpeg",.7));if(--left===0)render()};img.src=r.result};r.readAsDataURL(f)})});

document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;
 if(f.id==="f-ob"){const s=st.route.step;if(s<2){st.route={s:"ob",step:s+1};dir="";render(true);setTimeout(()=>document.querySelector(".big-input")?.focus(),300)}else{user={name:st.ob.name.trim(),phone:st.ob.phone.trim(),area:st.ob.area};save();st.stack=[];st.route={s:"home"};render(true);toast(`أهلاً ${first(user.name)}!`,"صار فيك تطلب أي شي من هون",IC.elec)}}
 if(f.id==="f-checkout"){const btn=$("#c-send");btn.disabled=true;btn.innerHTML=`<span class="spin"></span> عم نبعت الطلب…`;
  user.name=$("#c-name").value.trim()||user.name;user.phone=$("#c-phone").value.trim()||user.phone;
  const via=document.querySelector('#c-via [aria-pressed="true"]')?.dataset.via,isFix=f.dataset.kind==="fix";
  const o={id:Math.max(...orders.map(x=>x.id))+1,name:user.name,phone:user.phone,area:user.area,via,at:Date.now(),status:0,mine:true,chat:[]};
  if(isFix)Object.assign(o,{kind:"fix",cat:st.route.cat,issue:st.fix.issue,urgent:st.fix.urgent,when:st.fix.when,note:st.fix.note,photos:st.fix.photos});
  else{const l=cartList();Object.assign(o,{kind:"parts",cat:l[0].cat,items:l.map(x=>({n:x.n,q:x.q,p:x.p})),total:cartTotal()});cart={}}
  orders.unshift(o);seen.user[o.id]=0;save();
  setTimeout(()=>{closeSheet();st.fix={issue:null,urgent:false,when:"أقرب وقت",note:"",photos:[]};st.stack=[];st.route={s:"success",id:o.id};render(true)},900)}
 if(f.id==="f-offer"){const p=+$("#of-p").value,old=+$("#of-o").value,c=$("#of-c").value;
  offers.unshift({id:Date.now(),t:$("#of-t").value.trim(),d:$("#of-d").value.trim(),p,old:old>p?old:0,tag:$("#of-g").value.trim()||"عرض",cat:c,art:{elec:"solar",cam:"dome",alarm:"motion",sound:"speaker"}[c],ends:Date.now()+ +$("#of-h").value*3600e3,color:offers.length+3});
  save();closeSheet();render();toast("انتشر العرض","بيطلع هلق بأول صفحة عند الزبائن",IC.tag)}
 if(f.id==="f-chat"){const v=$("#msg").value.trim();if(!v)return;const o=orders.find(x=>x.id===st.chatId),admin=st.mode==="admin";
  (o.chat=o.chat||[]).push({from:admin?"admin":"user",t:v,at:Date.now(),readA:admin?1:0,readU:admin?0:1});save();render();$("#msg").focus();
  if(!admin&&!o.chat.some(m=>m.from==="admin")){st.typing=true;setTimeout(()=>{render();$("#msg")?.focus()},350);
   setTimeout(()=>{st.typing=false;o.chat.push({from:"admin",t:`أهلاً ${first(o.name)}، شفنا طلبك رقم ${o.id} 👍 فني من فريقنا رح يتواصل معك قريب.`,at:Date.now(),readA:1,readU:st.route.s==="chat"?1:0});save();if(st.route.s==="chat"&&st.mode==="app"){render();$("#msg")?.focus()}},2000)}}
});

render(true);
</script>
